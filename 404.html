<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="container text-center">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <!-- 404 Heading -->
                <h1 class="display-1 fw-bold text-dark mb-2" style="font-size: 7rem; letter-spacing: 2px;">404</h1>
                
                <!-- Subtitle -->
                <h3 class="fw-bold text-warning mb-3">Oops, Page not found!</h3>
                
                <!-- Description -->
                <p class="text-muted mb-4 px-lg-4" style="font-size: 0.95rem;">
                    Sorry, we're offline right now to make our site even better. Please, comeback later and check what we've been upto.
                </p>

                <!-- Search Form inside 404 Page -->
                <form onsubmit="handle404Search(event)" class="d-flex justify-content-center gap-2 mb-4">
                    <input type="text" id="searchInput404" class="form-control form-control-lg bg-white border shadow-sm py-2 px-3" placeholder="Enter your text" style="max-width: 300px;" required>
                    <button type="submit" class="btn btn-warning text-dark fw-bold px-4 shadow-sm">Search</button>
                </form>

                <!-- Back to Home Link -->
                <div>
                    <a href="index.html" class="text-dark text-decoration-none fw-bold d-inline-flex align-items-center gap-2 back-home-link">
                        <i class="bi bi-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 404 page ke andar search button ka function
        function handle404Search(event) {
            event.preventDefault();
            const query = document.getElementById('searchInput404').value;
            alert(`Searching for: "${query}"`);
            document.getElementById('searchInput404').value = '';
        }
    </script>
</body>
</html>
